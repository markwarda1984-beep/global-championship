name: Championship 5.2 underfollowed discovery radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'discovery_engine.py'
      - 'discovery_seeds.csv'
      - 'tests/test_discovery_engine.py'
      - '.github/workflows/discovery.yml'
  schedule:
    - cron: '35 2,8,10,13,16,21 * * *'
      timezone: 'Australia/Sydney'
permissions:
  contents: write
concurrency:
  group: championship-discovery-radar
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run entire offline test suite
        run: python -m unittest discover -s tests -v
      - name: Discover and screen external candidates — no broker or trading
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python discovery_engine.py
      - name: Validate and publish research-only watchlists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('reports/discovery_latest.json').read_text())
          registry=json.loads(Path('reports/discovery_watchlist.json').read_text())
          assert latest['orders_enabled'] is False
          assert registry['orders_enabled'] is False
          assert registry['original_200_unchanged'] is True
          assert isinstance(registry['candidates'], dict)
          assert latest.get('schema_version', '').startswith('5.2')
          assert latest.get('source_coverage') in ('COMPLETE_FOR_CONFIGURED_SAMPLES', 'CORE_SOURCES_AVAILABLE_WITH_FALLBACK', 'PARTIAL_OR_UNAVAILABLE')
          assert all(c.get('buy_readiness') is None and not c.get('orders_enabled') for c in registry['candidates'].values())
          for name in ('sec_8k', 'gdelt', 'google_news', 'bing_news'):
            source=latest.get('source_health', {}).get(name, {})
            if source.get('status') not in ('ok', 'not_needed'):
              print(f"::warning title=Discovery source incomplete::{name}: {source.get('status', 'missing')} - see reports/discovery_latest.json")
          print('Verified 5.2 discovery reports: no trades, fixed 200 untouched, source health explicit')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/discovery_latest.json reports/discovery_watchlist.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update underfollowed discovery radar [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload research report for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: championship-5-discovery-${{ github.run_number }}
          path: |
            reports/discovery_latest.json
            reports/discovery_watchlist.json
          if-no-files-found: warn
          retention-days: 14
