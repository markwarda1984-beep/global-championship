name: Championship 4.0 weekly valuation research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'championship_90.py'
      - 'settings/primary_adapters_90.json'
      - 'valuation_engine.py'
      - 'intelligence_layer_51.py'
      - 'evidence_upgrade_54.py'
      - 'championship_60.py'
      - 'forward_research_60.py'
      - 'settings/championship_60.json'
      - 'settings/dilution_stress_54.json'
      - 'tests/test_valuation_engine.py'
      - '.github/workflows/valuation.yml'
  schedule:
    - cron: '10 3 * * 0'
      timezone: 'Australia/Sydney'
permissions:
  contents: write
concurrency:
  group: championship-valuation-research
  cancel-in-progress: false
jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all offline scanner and model tests
        run: python -m unittest discover -s tests -v
      - name: Obtain latest available 200 daily-bar prices
        run: python scan.py
      - name: Assess all 200 company fundamentals and estimate indicative scenarios
        run: python valuation_engine.py --workers 3 --max-minutes 28
      - name: Prepare weekly valuation report
        run: |
          mkdir -p reports
          cp data/valuation_200.json reports/valuation_latest.json
      - name: Fetch bounded first-party SEC financial statements (missing facts stay unverified)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python evidence_upgrade_54.py --mode financials
      - name: Championship 6.0 weekly full-cycle valuations from verified primary series
        run: python championship_60.py --mode weekly
      - name: Publish weekly evidence-only Top 10 and AUD offset sensitivities
        run: python intelligence_layer_51.py --mode valuation
      - name: Verify weekly 6.0 model validation flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/valuation_60_weekly.json').read_text())
          assert d['original_watchlist_count']==200
          assert d['orders_enabled'] is False and d['validated_buy_signal_count']==0
          assert all(x['selected_entry'] is None for x in d['companies'] if x['validation_status']=='NOT VALIDATED')
          t=json.loads(Path('reports/valuation_top10_weekly.json').read_text())
          assert t['schema_version'].startswith('6.0')
          assert all(x['model_watch_entry'] is None for x in t['ranked_top_10'])
          v=json.loads(Path('reports/valuation_latest.json').read_text())
          assert all(x.get('model_watch_entry') is None and x.get('model_deep_entry') is None for x in v['stocks'])
          print('Weekly legacy watch entry calculation fully retired; 6.0 evidence gate governs all active entries')
          PY
      - name: Assess all companies with Championship 9.0
        run: python championship_90.py --mode weekly
      - name: Verify Championship 9.0 coverage and no orders
        run: python verify_90.py --mode weekly
      - name: Publish weekly valuation report to repository
        run: |
          git add reports/valuation_90_weekly.json reports/coverage_90_weekly.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/valuation_60_weekly.json reports/valuation_60_weekly_summary.json
          git add reports/valuation_latest.json reports/valuation_top10_weekly.json reports/offset_comparison_weekly.json reports/asymmetry_weekly.json reports/primary_financials_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Championship valuation [skip ci]"
            # Different scheduled workflows may update main within milliseconds.
            # Fetch/rebase before each bounded push retry; never force-push.
            published=false
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then
                published=true
                echo "Research report published successfully (attempt ${attempt}/6)"
                break
              fi
              if [ "${attempt}" -eq 6 ]; then
                echo "::error title=Report publishing conflict::Failed after six retries. Report remains in run artifacts."
                exit 1
              fi
              echo "::warning title=Concurrent report update::Another workflow changed main; retrying publish (${attempt}/6)"
              sleep $((attempt * 2))
            done
            test "$published" = true
          fi
      - name: Upload all 200 valuation research rows and data provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: championship-valuation-4-${{ github.run_number }}
          path: |
            reports/*90*.json
            data/valuation_200.csv
            data/valuation_200.json
            data/valuation_200.html
            data/valuation_200_run_summary.json
            reports/primary_financials_latest.json
            reports/asymmetry_weekly.json
            reports/valuation_60_weekly.json
            reports/valuation_60_weekly_summary.json
          if-no-files-found: warn
          retention-days: 14
