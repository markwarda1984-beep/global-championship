name: Championship 4.0 weekly valuation research
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Championship background evidence research]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'evidence_recovery_91.py'
      - 'recover_documents_91.py'
      - 'championship_90.py'
      - 'guidance_95.py'
      - 'reviewed_pdf_95.py'
      - 'pdf_rows_dynamic_92.py'
      - 'session_quotes_95.py'
      - 'verify_outputs_95.py'
      - 'reports/issuer_form_recovery_95.json'
      - 'reports/issuer_primary_records_95.json'
      - 'reports/reviewed_guidance_95.json'
      - 'settings/reviewed_pdf_95.json'
      - 'settings/recovery_baseline_95.json'
      - 'reviewed_shares_94.py'
      - 'share_classes_92.py'
      - 'reviewed_cashflow_92.py'
      - 'recovery_94.py'
      - 'settings/reviewed_share_classes_94.json'
      - 'settings/recovery_baseline_94.json'
      - 'reports/reviewed_share_counts_94.json'
      - 'reports/reviewed_cashflow_92.json'
      - 'dynamic_earnings_92.py'
      - 'collect_dynamic_92.py'
      - 'settings/dynamic_*.json'
      - 'reports/dynamic_historical_records_92.json'
      - 'reports/dynamic_guidance_92.json'
      - 'settings/primary_adapters_90.json'
      - 'valuation_engine.py'
      - 'intelligence_layer_51.py'
      - 'evidence_upgrade_54.py'
      - 'championship_60.py'
      - 'forward_research_60.py'
      - 'settings/championship_60.json'
      - 'settings/dilution_stress_54.json'
      - 'tests/test_valuation_engine.py'
      - '.github/workflows/valuation.yml'
  schedule:
    - cron: '10 3 * * 0'
      timezone: 'Australia/Sydney'
permissions:
  contents: write
concurrency:
  group: championship-valuation-research
  cancel-in-progress: false
jobs:
  valuation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all offline scanner and model tests
        run: python -m unittest discover -s tests -v
      - name: Obtain latest available 200 daily-bar prices
        run: python scan.py
      - name: Collect separately timestamped pre-market and after-hours sessions
        run: python session_quotes_95.py --mode weekly
      - name: Assess all 200 company fundamentals and estimate indicative scenarios
        run: python valuation_engine.py --workers 3 --max-minutes 28
      - name: Prepare weekly valuation report
        run: |
          mkdir -p reports
          cp data/valuation_200.json reports/valuation_latest.json
      - name: Fetch bounded first-party SEC financial statements (missing facts stay unverified)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python evidence_upgrade_54.py --mode financials
      - name: Refresh all 200 issuer statement sources when due
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python evidence_recovery_91.py --only-if-due
      - name: Reconcile primary listed-share documents when due
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python recover_documents_91.py --only-if-due
      - name: Refresh explicitly dated FX research
        run: python refresh_fx_91.py
      - name: Championship 6.0 weekly full-cycle valuations from verified primary series
        run: python championship_60.py --mode weekly
      - name: Publish weekly evidence-only Top 10 and AUD offset sensitivities
        run: python intelligence_layer_51.py --mode valuation
      - name: Verify weekly 6.0 model validation flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/valuation_60_weekly.json').read_text())
          assert d['original_watchlist_count']==200
          assert d['orders_enabled'] is False and d['validated_buy_signal_count']==0
          assert all(x['selected_entry'] is None for x in d['companies'] if x['validation_status']=='NOT VALIDATED')
          t=json.loads(Path('reports/valuation_top10_weekly.json').read_text())
          assert t['schema_version'].startswith('6.0')
          assert all(x['model_watch_entry'] is None for x in t['ranked_top_10'])
          v=json.loads(Path('reports/valuation_latest.json').read_text())
          assert all(x.get('model_watch_entry') is None and x.get('model_deep_entry') is None for x in v['stocks'])
          print('Weekly legacy watch entry calculation fully retired; 6.0 evidence gate governs all active entries')
          PY
      - name: Assess all companies with Championship 9.0
        run: python championship_90.py --mode weekly
      - name: Audit recovery against the frozen 111 outstanding companies
        run: python collect_documents_dynamic_92.py --max-documents 0 --audit-suffix weekly
      - name: Build and verify separate historical and dynamic forward views
        run: python dynamic_earnings_92.py --mode weekly
      - name: Independently verify the financial outputs and baseline preservation
        run: python verify_financial_outputs_92.py --mode weekly
      - name: Verify recovered denominators, financial outputs and coverage gain
        run: python recovery_94.py --mode weekly
      - name: Independently inspect new primary financial and session outputs
        run: python verify_outputs_95.py --mode weekly
      - name: Verify Championship 9.0 coverage and no orders
        run: python verify_90.py --mode weekly
      - name: Publish weekly valuation report to repository
        run: |
          git add reports/primary_evidence_91.json reports/share_basis_recovery_91.json reports/fx_recovery_91.json settings/primary_adapters_90.json
          git add reports/valuation_90_weekly.json reports/coverage_90_weekly.json
          git add reports/recovery_94_weekly.json reports/recovery_95_weekly.json reports/session_quotes_95_weekly.json
          git add reports/dynamic_source_recovery_92_weekly.json reports/dynamic_earnings_92_weekly.json reports/dynamic_earnings_92_weekly.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/valuation_60_weekly.json reports/valuation_60_weekly_summary.json
          git add reports/valuation_latest.json reports/valuation_top10_weekly.json reports/offset_comparison_weekly.json reports/asymmetry_weekly.json reports/primary_financials_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Championship valuation [skip ci]"
            # Different scheduled workflows may update main within milliseconds.
            # Fetch/rebase before each bounded push retry; never force-push.
            published=false
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then
                published=true
                echo "Research report published successfully (attempt ${attempt}/6)"
                break
              fi
              if [ "${attempt}" -eq 6 ]; then
                echo "::error title=Report publishing conflict::Failed after six retries. Report remains in run artifacts."
                exit 1
              fi
              echo "::warning title=Concurrent report update::Another workflow changed main; retrying publish (${attempt}/6)"
              sleep $((attempt * 2))
            done
            test "$published" = true
          fi
      - name: Upload all 200 valuation research rows and data provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: championship-valuation-4-${{ github.run_number }}
          path: |
            reports/dynamic*92*
            reports/*91*.json
            reports/*90*.json
            data/valuation_200.csv
            data/valuation_200.json
            data/valuation_200.html
            data/valuation_200_run_summary.json
            reports/primary_financials_latest.json
            reports/asymmetry_weekly.json
            reports/valuation_60_weekly.json
            reports/valuation_60_weekly_summary.json
          if-no-files-found: warn
          retention-days: 14
