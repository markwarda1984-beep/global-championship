name: Championship intensive 200-stock scan
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Championship background evidence research]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'championship_90.py'
      - 'reviewed_shares_94.py'
      - 'share_classes_92.py'
      - 'reviewed_cashflow_92.py'
      - 'recovery_94.py'
      - 'settings/reviewed_share_classes_94.json'
      - 'settings/recovery_baseline_94.json'
      - 'reports/reviewed_share_counts_94.json'
      - 'reports/reviewed_cashflow_92.json'
      - 'dynamic_earnings_92.py'
      - 'collect_dynamic_92.py'
      - 'settings/dynamic_*.json'
      - 'reports/dynamic_historical_records_92.json'
      - 'reports/dynamic_guidance_92.json'
      - 'settings/primary_adapters_90.json'
      - 'scan.py'
      - 'opportunity_engine.py'
      - 'report_bridge.py'
      - 'intelligence_layer_51.py'
      - 'evidence_upgrade_54.py'
      - 'championship_60.py'
      - 'forward_research_60.py'
      - 'settings/championship_60.json'
      - 'settings/dilution_stress_54.json'
      - 'settings/intelligence_51.json'
      - 'README_INTELLIGENCE_51.md'
      - 'decisions/manual_decisions.json'
      - 'watchlist.csv'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/scan.yml'
  schedule:
    - cron: '20 2,8,10,13,16,21 * * *'
      timezone: 'Australia/Sydney'
permissions:
  contents: write
concurrency:
  group: championship-price-scan
  cancel-in-progress: false
jobs:
  intensive_scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests for all 200 stocks
        run: python -m unittest discover -s tests -v
      - name: Run independent 200-stock research scan
        run: python scan.py
      - name: Run research triage with explicit non-trading guards
        run: python opportunity_engine.py
      - name: Snapshot previous report for scan-to-scan changes
        run: python intelligence_layer_51.py --mode snapshot
      - name: Championship 6.0 evidence-gated 200-plus-discovery dated-price report
        run: python championship_60.py --mode scan
      - name: Publish complete per-company SEC and forward-research coverage status
        run: python forward_research_60.py --mode coverage
      - name: Verify filing provenance and strictly evidence-qualified undervaluation queues
        run: |
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/coverage_60.json').read_text())
          assert d['original_watchlist_count']==200
          assert d['reported_count']==200+d['discovery_count']
          assert len(d['companies'])==d['reported_count']
          assert d['orders_enabled'] is False and d['orders_generated']==0
          rows={r['ticker']:r for r in d['companies']}
          assert len(rows)==len(d['companies'])
          assert sum(r['universe']=='ORIGINAL_200' for r in rows.values())==200
          assert d['evidence_qualified_at_selected_margin_of_safety_count']==len(d['evidence_qualified_at_selected_margin_of_safety'])
          assert d['validated_below_assumed_base_count']==len(d['evidence_qualified_below_base_research'])
          for k in ('evidence_qualified_below_base_research','evidence_qualified_at_selected_margin_of_safety'):
            for x in d[k]:
              r=rows[x['ticker']]
              assert r['qualifies_for_further_intrinsic_review'] is True
              assert r['selected_margin_of_safety_entry'] is not None
              assert x['buy_signal'] is False and x['orders_enabled'] is False
          for r in rows.values():
            assert r['orders_enabled'] is False and r['buy_signal'] is False
            if r['valuation_validation_status']=='NOT VALIDATED':
              assert r['selected_margin_of_safety_entry'] is None
              assert r['below_selected_margin_of_safety_entry'] is None
          print('Verified 6.0 filing-provenance research shortlist (zero order signals)')
          PYVERIFY
      - name: Build 200-stock report for ChatGPT (6.0 entries only)
        run: python report_bridge.py
      - name: Generate evidence-only Top 10, AUD offset sensitivities, change feed and journal
        run: python intelligence_layer_51.py --mode scan
      - name: Verify all 200 stocks, new leads, null missing targets, and zero orders
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/valuation_60_latest.json').read_text())
          assert data['original_watchlist_count']==200
          assert data['reported_count']==len(data['companies'])
          assert data['orders_enabled'] is False and data['orders_generated']==0
          assert data['validated_buy_signal_count']==0
          assert sum(x['universe']=='ORIGINAL_200' for x in data['companies'])==200
          for row in data['companies']:
            assert row['orders_enabled'] is False and row['research_only'] is True
            if row['validation_status']=='NOT VALIDATED':
              assert row['verified_intrinsic_value'] is None and row['selected_entry'] is None
              assert not any(x is not None for x in row['margin_of_safety_entries'].values())
            else:
              assert row['primary_source_evidence']['source_hash_sha256']
              assert row['selected_margin_of_safety_pct'] in (10,15,20)
          legacy=json.loads(Path('reports/latest.json').read_text())
          assert legacy['schema_version'].startswith('6.0')
          assert all(x['provisional_entry'] is None and x['pct_above_entry'] is None for x in legacy['stocks'])
          assert all(x['selected_entry_60'] is None for x in legacy['stocks'] if x['validation_status_60']=='NOT VALIDATED')
          nvda=next(x for x in legacy['stocks'] if x['ticker']=='NVDA')
          assert nvda['provisional_entry'] is None
          t=json.loads(Path('reports/valuation_top10_latest.json').read_text())
          assert t['schema_version'].startswith('6.0')
          assert all(x['model_watch_entry'] is None for x in t['ranked_top_10'])
          comparison=json.loads(Path('reports/offset_comparison_latest.json').read_text())
          assert len(comparison['ranked_research_scenarios'])==len(t['ranked_top_10'])
          print('Retired US$33.39 NVDA provisional entry; all active reports use 6.0 evidence only')
          print('6.0 research-only report validated')
          PY
      - name: Verify safe evidence-gated ranking and offset scenarios
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('reports/asymmetry_latest.json').read_text())
          o=json.loads(Path('reports/offset_comparison_latest.json').read_text())
          assert a['orders_enabled'] is False
          assert all(x['primary_model_economics_verified'] for x in a['evidence_qualified_top10'])
          assert {'illustrative_5_8','unconfirmed_6_01'} <= {x['id'] for x in o['offset_rate_scenarios']}
          assert o['orders_enabled'] is False
          PY
      - name: Refresh priority daily bars and session lows
        run: python championship_90.py --mode quotes
      - name: Assess all companies with Championship 9.0
        run: python championship_90.py --mode scan
      - name: Audit recovery against the frozen 111 outstanding companies
        run: python collect_documents_dynamic_92.py --max-documents 0 --audit-suffix scan
      - name: Build and verify separate historical and dynamic forward views
        run: python dynamic_earnings_92.py --mode scan
      - name: Independently verify the financial outputs and baseline preservation
        run: python verify_financial_outputs_92.py --mode scan
      - name: Verify recovered denominators, financial outputs and coverage gain
        run: python recovery_94.py --mode scan
      - name: Verify Championship 9.0 coverage and no orders
        run: python verify_90.py --mode scan
      - name: Publish full 200-stock evidence recovery audit
        run: python coverage_recovery_audit_91.py
      - name: Publish machine-readable report to repository
        run: |
          git add reports/coverage_recovery_91.json reports/coverage_recovery_91.md
          git add reports/valuation_90_latest.json reports/coverage_90_latest.json
          git add reports/recovery_94_latest.json reports/priority_quotes_90.json
          git add reports/dynamic_source_recovery_92_scan.json reports/dynamic_earnings_92_latest.json reports/dynamic_earnings_92_latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/valuation_60_latest.json reports/valuation_60_summary.json
          git add reports/coverage_60.json
          git add reports/latest.json reports/changes_latest.json reports/valuation_top10_latest.json reports/offset_comparison_latest.json reports/decision_journal.json reports/intelligence_latest.json reports/asymmetry_latest.json
          if [ -f reports/fx_aud_latest.json ]; then git add reports/fx_aud_latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Championship 200-stock report [skip ci]"
            # Different scheduled workflows may update main within milliseconds.
            # Fetch/rebase before each bounded push retry; never force-push.
            published=false
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then
                published=true
                echo "Research report published successfully (attempt ${attempt}/6)"
                break
              fi
              if [ "${attempt}" -eq 6 ]; then
                echo "::error title=Report publishing conflict::Failed after six retries. Report remains in run artifacts."
                exit 1
              fi
              echo "::warning title=Concurrent report update::Another workflow changed main; retrying publish (${attempt}/6)"
              sleep $((attempt * 2))
            done
            test "$published" = true
          fi
      - name: Upload all 200 rows, dashboard and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: championship-200-dashboard-${{ github.run_number }}
          path: |
            reports/dynamic*92*
            reports/*91*.json
            reports/coverage_recovery_91.md
            reports/*90*.json
            data/
            reports/valuation_60_latest.json
            reports/valuation_60_summary.json
            reports/coverage_60.json
          if-no-files-found: warn
          retention-days: 14
